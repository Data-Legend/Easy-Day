<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="120" y2="120">
      <stop offset="0%" stop-color="#5b7bfa"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0c0e14" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Main Rounded Background -->
  <rect width="120" height="120" rx="28" fill="url(#brandGrad)"/>
  
  <!-- Glowing Sun / Day Indicator -->
  <circle cx="78" cy="40" r="20" fill="#ffffff" opacity="0.3"/>
  
  <!-- Abstract Open Book / Horizon Line -->
  <path d="M 26 96 Q 43 86 60 96 Q 77 86 94 96" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
  
  <!-- Sharp Confident Checkmark -->
  <path d="M 32 64 L 54 86 L 90 40" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>
</svg>
